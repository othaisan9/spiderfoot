# Docker Compose for SpiderFoot BE with Neo4j Integration
# Provides complete graph database stack for OSINT analysis

version: '3.8'

services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.20-community
    container_name: spiderfoot-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      # Authentication
      NEO4J_AUTH: neo4j/spiderfoot
      
      # Security and Performance
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      
      # Memory settings
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      
      # Connection settings
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
      
      # Enable APOC and GDS plugins
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      
      # Performance tuning
      NEO4J_dbms_tx__log_rotation_retention__policy: "2 days"
      NEO4J_dbms_checkpoint_interval_time: "30s"
      
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SpiderFoot BE Application
  spiderfoot-be:
    build: 
      context: .
      dockerfile: Dockerfile.neo4j
    container_name: spiderfoot-be
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # Neo4j connection
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: spiderfoot
      
      # SpiderFoot settings
      SPIDERFOOT_LISTEN_IP: 0.0.0.0
      SPIDERFOOT_LISTEN_PORT: 5001
      
      # Performance settings
      PYTHONUNBUFFERED: 1
      
    volumes:
      - ./spiderfoot:/app/spiderfoot
      - spiderfoot_data:/app/data
      - spiderfoot_logs:/app/logs
    
    depends_on:
      neo4j:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for caching and task queues (optional)
  redis:
    image: redis:7-alpine
    container_name: spiderfoot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: spiderfoot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - spiderfoot-be
      - neo4j

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  spiderfoot_data:
    driver: local
  spiderfoot_logs:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: spiderfoot-network
    driver: bridge